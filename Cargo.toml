[package]
name = "ilearned"
version = "0.2.1"
edition = "2021"
description = "Lightweight, local-first memory for self-improving AI agents"
license = "MIT"
repository = "https://github.com/jerrywang121/ilearned"
homepage = "https://github.com/jerrywang121/ilearned"
readme = "README.md"
keywords = ["ai", "agent", "memory", "cli", "mcp", "self-improving"]
categories = ["command-line-utilities"]

[[bin]]
name = "ilearned"
path = "src/main.rs"

[lib]
name = "ilearned"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["form"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
askama = "0.12"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
rmcp = { version = "3", features = ["server", "transport-io", "transport-streamable-http-server", "schemars"] }
async-trait = "0.1"
schemars = "1"

[dev-dependencies]
tempfile = "3"
toml = "0.8"

# Profile used by cargo-dist for release builds
[profile.dist]
inherits = "release"
lto = "thin"
